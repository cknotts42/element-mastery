:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#eaf1fc;background:#101827;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1020px;margin:auto;padding:20px 18px 80px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.logo{font-size:30px;background:#e1b245;color:#152039;border-radius:14px;padding:9px 16px}.muted{color:#a7b7cd}.small{font-size:.86rem}h1{font-size:1.6rem;margin:0}h2{font-size:1.35rem;margin:0 0 13px}h3{margin:0 0 8px}p{line-height:1.5}.card{background:#1d2a40;border:1px solid #31415a;border-radius:16px;padding:20px;margin:0 0 18px}.sub{background:#263650;border-radius:12px;padding:16px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.group{background:#263650;color:#eef4ff;text-align:left;border:1px solid #415470;border-radius:12px;padding:16px 12px;min-height:98px}.group:hover,.group.selected{border-color:#f0be4e;background:#36435b}.group strong{display:block;font-size:1.35rem;margin:7px 0}.group .small{color:#c2cce0}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:18px}.btn{border:1px solid #4a5d79;border-radius:10px;padding:11px 16px;color:#f7fbff;background:#30435f;font-weight:650}.btn:hover{filter:brightness(1.15)}.btn.primary{background:#e0b147;color:#1a2437;border-color:#e0b147}.btn.ghost{background:transparent}.btn.danger{background:#4f2a37;border-color:#9c5667}.btn.active{outline:2px solid #e0b147}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.spaced{margin:16px 0}.progress{height:12px;border-radius:30px;background:#3a4b62;overflow:hidden}.progress>div{height:100%;background:#e0b147;transition:width .2s}.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}.modes .btn{padding:16px 8px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field input,.field select{background:#101d30;border:1px solid #536780;color:#fff;border-radius:9px;padding:12px;min-width:0;width:100%}input[type=checkbox]{accent-color:#e0b147;width:18px;height:18px}.checks{display:flex;gap:12px;flex-wrap:wrap}.checks label{display:flex;gap:6px;align-items:center}.question{text-align:center;padding:24px 10px}.question .main{font-size:clamp(2.5rem,9vw,5rem);font-weight:750;color:#ffd277;line-height:1.35;overflow-wrap:anywhere}.question .eyebrow{color:#b9c9dc;font-size:.9rem}.answergrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:560px;margin:16px auto}.answergrid.single{grid-template-columns:1fr;max-width:320px}.feedback{padding:13px 16px;border-radius:9px;margin:14px 0}.feedback.ok{background:#183e36;color:#b7f5d5}.feedback.bad{background:#492b3d;color:#ffd9e1}.stats{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0;color:#c5d3e5}.bigcenter{display:block;text-align:center}.flashcard{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;background:#263650;border:1px solid #6b7790;border-radius:14px;cursor:pointer;padding:26px}.flashcard .answer{font-size:1.45rem;color:#ffe1a0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:440px}th,td{border-bottom:1px solid #3a4b62;padding:11px;text-align:left}th{color:#d8e4f5}.pill{display:inline-block;background:#344861;border-radius:12px;padding:3px 9px;font-size:.8rem}.focus{color:#ffd277}.quiet{border:0;background:none;color:#bbcee6;text-decoration:underline;cursor:pointer;padding:4px}.sr{position:absolute;left:-10000px}.hide{display:none!important}footer{margin-top:35px;color:#879bb4;font-size:.83rem}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#294b43;color:#eafff1;padding:10px 18px;border-radius:10px;display:none;z-index:3}@media(max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.modes{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.answergrid{grid-template-columns:1fr}.wrap{padding:15px 12px 65px}.card{padding:16px}.group{min-height:84px}}
</style></head><body><div class="wrap"><header><div class="brand"><div class="logo" aria-hidden="true">⚛</div><div><h1>Element Mastery</h1><div class="muted small">92 elements. Ten at a time.</div></div></div><button id="home" class="btn ghost hide">← Home</button></header><main id="app"></main><footer>Progress is saved in this browser on this device. Use Export Backup to keep a copy; clearing browser data may erase progress.</footer></div><div role="status" aria-live="polite" id="toast"></div><script>
'use strict';
const rows=`Hydrogen,H|Helium,He|Lithium,Li|Beryllium,Be|Boron,B|Carbon,C|Nitrogen,N|Oxygen,O|Fluorine,F|Neon,Ne|Sodium,Na|Magnesium,Mg|Aluminum,Al|Silicon,Si|Phosphorus,P|Sulfur,S|Chlorine,Cl|Argon,Ar|Potassium,K|Calcium,Ca|Scandium,Sc|Titanium,Ti|Vanadium,V|Chromium,Cr|Manganese,Mn|Iron,Fe|Cobalt,Co|Nickel,Ni|Copper,Cu|Zinc,Zn|Gallium,Ga|Germanium,Ge|Arsenic,As|Selenium,Se|Bromine,Br|Krypton,Kr|Rubidium,Rb|Strontium,Sr|Yttrium,Y|Zirconium,Zr|Niobium,Nb|Molybdenum,Mo|Technetium,Tc|Ruthenium,Ru|Rhodium,Rh|Palladium,Pd|Silver,Ag|Cadmium,Cd|Indium,In|Tin,Sn|Antimony,Sb|Tellurium,Te|Iodine,I|Xenon,Xe|Cesium,Cs|Barium,Ba|Lanthanum,La|Cerium,Ce|Praseodymium,Pr|Neodymium,Nd|Promethium,Pm|Samarium,Sm|Europium,Eu|Gadolinium,Gd|Terbium,Tb|Dysprosium,Dy|Holmium,Ho|Erbium,Er|Thulium,Tm|Ytterbium,Yb|Lutetium,Lu|Hafnium,Hf|Tantalum,Ta|Tungsten,W|Rhenium,Re|Osmium,Os|Iridium,Ir|Platinum,Pt|Gold,Au|Mercury,Hg|Thallium,Tl|Lead,Pb|Bismuth,Bi|Polonium,Po|Astatine,At|Radon,Rn|Francium,Fr|Radium,Ra|Actinium,Ac|Thorium,Th|Protactinium,Pa|Uranium,U`;
const elements=rows.split('|').map((r,i)=>{let [name,symbol]=r.split(',');return {number:i+1,name,symbol}});
const key='element-mastery-v1';const defaults=()=>({mastery:{},bests:{},settings:{group:0,cumulative:false,mode:'dual',prompt:'random',order:'random',repeat:true}});
let saved;try{saved=JSON.parse(localStorage.getItem(key))||defaults()}catch{saved=defaults()}let data={...defaults(),...saved,settings:{...defaults().settings,...(saved.settings||{})}};
let storageAvailable=false;try{const test='__element_mastery_storage_test__';localStorage.setItem(test,'ok');storageAvailable=localStorage.getItem(test)==='ok';localStorage.removeItem(test)}catch{}
if(!storageAvailable){document.querySelector('footer').textContent='⚠ Browser storage is blocked. Progress will reset on reload. Open the app directly in a regular browser window (not private browsing).'}
let page='home',session=null,flash=null,reviewPage=0,timerGeneration=0;const app=document.getElementById('app'),home=document.getElementById('home');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch{toast('Local storage is unavailable. Progress may not persist.')}};const toast=msg=>{let el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',2300)};const pick=a=>a[Math.floor(Math.random()*a.length)];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}const groupRange=i=>[i*10+1,Math.min((i+1)*10,92)];const pool=()=>{let [a,b]=groupRange(data.settings.group);if(data.settings.cumulative)a=1;return elements.filter(e=>e.number>=a&&e.number<=b)};const fmt=n=>`${Math.round(n/1000*10)/10}s`;function updateHome(){page='home';session=null;flash=null;render()}home.onclick=updateHome;
function selectGroup(g){data.settings.group=g;save();render()};function toggleCumulative(val){data.settings.cumulative=val;save();render()}
function track(e,prompt,asks,correct){
 let row=data.mastery[e.number]||(data.mastery[e.number]={attempts:0,correct:0,streak:0,byType:{},byAnswer:{}});
 if(!row.byAnswer&&row.correct>0)row.legacyCredit=true;
 row.attempts++;if(correct){row.correct++;row.streak++}else row.streak=0;
 let t=row.byType[prompt]||(row.byType[prompt]={attempts:0,correct:0,streak:0});t.attempts++;if(correct){t.correct++;t.streak++}else t.streak=0;
 row.byAnswer=row.byAnswer||{};
 if(correct)for(const field of asks)row.byAnswer[field]=(row.byAnswer[field]||0)+1;
 // Existing completed practice attempts retain credit when upgrading the embedded app.
 save();
}
function masteryFields(x){
 if(!x)return 0;
 if(x.legacyCredit)return 2;
 if(x.byAnswer)return ['name','symbol','number'].filter(t=>(x.byAnswer[t]||0)>0).length;
 // Legacy records did not save which two answers were recalled; avoid discarding their work.
 return x.correct>0?2:0;
}
function mastered(e){return masteryFields(data.mastery[e.number])>=2}
function practiced(e){return (data.mastery[e.number]?.attempts||0)>0}
function opts(){let s=data.settings;return `<div class="formgrid"><label class="field">Answer mode<select id="settingMode"><option value="dual" ${s.mode==='dual'?'selected':''}>Two answers (show one, supply two)</option><option value="single" ${s.mode==='single'?'selected':''}>One answer (show one, supply one)</option></select></label><label class="field">Question prompt<select id="settingPrompt"><option value="random" ${s.prompt==='random'?'selected':''}>Random: name, symbol or number</option><option value="name" ${s.prompt==='name'?'selected':''}>Show element name</option><option value="symbol" ${s.prompt==='symbol'?'selected':''}>Show symbol</option><option value="number" ${s.prompt==='number'?'selected':''}>Show atomic number</option></select></label><label class="field">Question order<select id="settingOrder"><option value="random" ${s.order==='random'?'selected':''}>Random</option><option value="sequential" ${s.order==='sequential'?'selected':''}>Atomic number order</option></select></label><label class="field" style="flex-direction:row;align-items:center;margin-top:22px"><input id="settingRepeat" type="checkbox" style="width:auto" ${s.repeat?'checked':''}> Revisit mistakes more often (practice only)</label></div><p class="muted small">In single-answer mode, the app asks for one of the two missing fields. In two-answer mode, both missing fields are required.</p>`}
function bindSettings(){let map={settingMode:'mode',settingPrompt:'prompt',settingOrder:'order',settingRepeat:'repeat'};for(let [id,k] of Object.entries(map)){document.getElementById(id).onchange=e=>{data.settings[k]=id==='settingRepeat'?e.target.checked:e.target.value;save()}}}
function render(){home.classList.toggle('hide',page==='home');if(page==='home'){const count=elements.filter(mastered).length,groups=Array.from({length:10},(_,i)=>{let [a,b]=groupRange(i);return `<button class="group ${data.settings.group===i?'selected':''}" data-group="${i}" aria-pressed="${data.settings.group===i}"><span class="small">GROUP ${i+1}</span><strong>${a}–${b}</strong><span class="small">${elements.filter(e=>e.number>=a&&e.number<=b&&mastered(e)).length}/${b-a+1} mastered · ${elements.filter(e=>e.number>=a&&e.number<=b&&practiced(e)).length} practiced</span></button>`}).join('');app.innerHTML=`<section class="card"><div class="row between"><h2>Your progress</h2><strong class="focus">${count} / 92</strong></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="92" aria-valuenow="${count}"><div style="width:${count/92*100}%"></div></div><p class="muted small">An element is marked mastered when you correctly recall at least two different pieces of information. Two-answer practice can earn mastery in one successful question. Keep practicing to strengthen all three facts.</p></section><section class="card"><h2>Choose an element group</h2><div class="grid">${groups}</div><label class="row spaced"><input type="checkbox" id="cumulative" ${data.settings.cumulative?'checked':''}> Include all previous groups (elements 1 through the selected group's end)</label></section><section class="card"><h2>Choose a study mode</h2><p class="muted">Current selection: <strong>${data.settings.cumulative?'1':groupRange(data.settings.group)[0]}–${groupRange(data.settings.group)[1]}</strong></p><div class="modes"><button class="btn" data-go="learn">📖 Learn</button><button class="btn" data-go="flash">▣ Flashcards</button><button class="btn" data-go="practice">⌨ Practice</button><button class="btn" data-go="speed">⏱ Speed Challenge</button></div><h3>Practice settings</h3>${opts()}</section><div class="row"><button class="btn ghost" data-go="progress">View element progress</button><button class="btn ghost" data-go="records">Personal bests</button><button class="btn ghost" data-go="reset">Reset saved progress</button><button class="btn ghost" id="exportBackup">Export progress backup</button><button class="btn ghost" id="importBackup">Import progress backup</button><input id="importBackupFile" type="file" accept="application/json,.json" hidden></div>`;document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>selectGroup(+b.dataset.group));document.getElementById('cumulative').onchange=e=>toggleCumulative(e.target.checked);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));bindSettings();document.getElementById('exportBackup').onclick=exportBackup;document.getElementById('importBackup').onclick=()=>document.getElementById('importBackupFile').click();document.getElementById('importBackupFile').onchange=importBackup;return}
if(page==='learn')return renderLearn();if(page==='flash')return renderFlash();if(page==='practice'||page==='speed')return renderQuestion();if(page==='finish')return renderFinish();if(page==='progress')return renderProgress();if(page==='records')return renderRecords()}
function go(which){if(which==='reset'){if(confirm('Erase all progress, settings, and speed records on this device?')){data=defaults();save();render()}return}page=which;if(which==='flash'){flash={items:structuredClone(pool()),idx:0,reveal:false};if(data.settings.order==='random')flash.items=shuffle(flash.items)}if(which==='practice'||which==='speed')startSession(which);render()}
function renderLearn(){app.innerHTML=`<section class="card"><h2>Learn elements ${pool()[0].number}–${pool().at(-1).number}</h2><p class="muted">Read the atomic number, chemical symbol, and element name. When ready, try flashcards or practice.</p><div class="tablewrap"><table><thead><tr><th>Atomic number</th><th>Symbol</th><th>Name</th></tr></thead><tbody>${pool().map(e=>`<tr><td>${e.number}</td><td><strong>${e.symbol}</strong></td><td>${e.name}</td></tr>`).join('')}</tbody></table></div></section><div class="row"><button class="btn" onclick="go('flash')">Flashcards →</button><button class="btn primary" onclick="go('practice')">Practice →</button></div>`}
function renderFlash(){let f=flash,e=f.items[f.idx],prompt=data.settings.prompt==='random'?['name','symbol','number'][f.idx%3]:data.settings.prompt,shown=e[prompt];app.innerHTML=`<section class="card"><div class="row between"><h2>Flashcards</h2><span class="muted">${f.idx+1} / ${f.items.length}</span></div><div class="flashcard" id="flip" role="button" tabindex="0" aria-label="Reveal flashcard answer"><span class="muted small">${prompt==='number'?'Atomic number':prompt==='symbol'?'Symbol':'Name'}</span><strong style="font-size:clamp(2rem,7vw,4rem)">${shown}</strong>${f.reveal?`<div class="answer">${e.number} · ${e.symbol} · ${e.name}</div>`:'<span class="muted small">Tap to reveal</span>'}</div><div class="row between spaced"><button class="btn" id="prev" ${f.idx===0?'disabled':''}>← Previous</button><button class="btn primary" id="next">${f.idx===f.items.length-1?'Restart':'Next →'}</button></div><p class="muted small">Flashcards are for study. Practice and Speed Challenge both record mastery.</p></section>`;const flip=()=>{f.reveal=!f.reveal;renderFlash()};document.getElementById('flip').onclick=flip;document.getElementById('flip').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};document.getElementById('prev').onclick=()=>{f.idx--;f.reveal=false;renderFlash()};document.getElementById('next').onclick=()=>{f.idx=f.idx===f.items.length-1?0:f.idx+1;f.reveal=false;renderFlash()}}
function startSession(kind){let items=pool();let order=data.settings.order==='random'?shuffle(items):[...items];session={kind,items:order,idx:0,answered:0,correct:0,missed:new Set(),penalties:0,started:null,finishTime:null,current:null,feedback:null,pendingNext:false,attempts:0,priorWrong:false,reviewQueue:[],config:{...data.settings},range:`${items[0].number}–${items.at(-1).number}`};if(kind==='speed')session.items=order.slice(0,Math.min(10,order.length));nextQuestion()}
function nextQuestion(){let s=session;if(s.idx>=s.items.length){if(s.kind==='practice'&&s.config.repeat&&s.reviewQueue.length){s.items.push(...s.reviewQueue.splice(0))}else{finishSession();return}}let e=s.items[s.idx],prompt=s.config.prompt==='random'?pick(['name','symbol','number']):s.config.prompt;let asks=['name','symbol','number'].filter(x=>x!==prompt);if(s.config.mode==='single')asks=[pick(asks)];s.current={e,prompt,asks};s.feedback=null;s.pendingNext=false;s.priorWrong=false}
function normalize(value,field){value=String(value).trim().normalize('NFKC');return field==='number'?value.replace(/^0+(?=\d)/,''):value.toLowerCase().replace(/\s+/g,' ')}
function validateAnswer(value,e,field){return normalize(value,field)===normalize(e[field],field)}
function submitAnswer(ev){ev?.preventDefault();let s=session;if(s.pendingNext)return;let {e,prompt,asks}=s.current;let vals=asks.map(k=>document.getElementById('ans-'+k).value);if(vals.some(v=>!v.trim())){toast('Enter every requested answer.');return}let correct=asks.every((k,i)=>validateAnswer(vals[i],e,k));s.attempts++;if(!correct){s.priorWrong=true;s.missed.add(e.number);if(s.kind==='speed')s.penalties+=5000;else if(s.config.repeat&&!s.reviewQueue.includes(e))s.reviewQueue.push(e)}track(e,prompt,asks,correct);if(correct){s.correct++;s.answered++}else if(s.kind==='practice'){s.answered++}s.feedback={correct,expected:asks.map(k=>`${k==='number'?'Atomic number':k==='symbol'?'Symbol':'Name'}: ${e[k]}`).join(' · ')};s.pendingNext=true;renderQuestion()}
function advance(){let s=session;s.idx++;nextQuestion();render()}
function renderQuestion(){let s=session;if(!s)return;let q=s.current;if(!q)return;let labels={name:'Element name',symbol:'Chemical symbol',number:'Atomic number'};let title=s.kind==='speed'?'Speed Challenge':'Practice';app.innerHTML=`<section class="card"><div class="row between"><h2>${title}</h2><span class="pill">${esc(s.range)}</span></div><div class="stats"><span>Question <strong>${s.idx+1}</strong> / ${s.items.length}</span><span>Correct: <strong>${s.correct}</strong></span>${s.kind==='speed'?`<span>Penalty: <strong>${s.penalties/1000}s</strong></span><span>Time: <strong id="timer">0.0s</strong></span>`:''}</div><div class="progress"><div style="width:${Math.min(100,s.idx/s.items.length*100)}%"></div></div><div class="question"><div class="eyebrow">${labels[q.prompt]}</div><div class="main">${esc(q.e[q.prompt])}</div><div class="muted">${s.config.mode==='dual'?'Enter both missing answers':'Enter the missing answer'}</div></div>${s.pendingNext?`<div class="feedback ${s.feedback.correct?'ok':'bad'}" role="status"><strong>${s.feedback.correct?'Correct!':'Not quite.'}</strong> ${s.feedback.correct?'':`Correct answer${q.asks.length>1?'s':''}: ${s.feedback.expected}`}</div><button id="nextq" class="btn primary">${!s.feedback.correct&&s.kind==='speed'?'Try again →':s.idx+1>=s.items.length&&!(s.kind==='practice'&&s.config.repeat&&s.reviewQueue.length)?'See results →':'Next question →'}</button>`:`<form id="answerform"><div class="answergrid ${q.asks.length===1?'single':''}">${q.asks.map(k=>`<label class="field">${labels[k]}<input id="ans-${k}" autocomplete="off" autocapitalize="off" spellcheck="false" ${k==='number'?'inputmode="numeric"':''} required></label>`).join('')}</div><div class="bigcenter"><button class="btn primary" type="submit">Check answer →</button></div></form>`}<p class="muted small">${s.kind==='speed'?'The stopwatch starts on your first answer. Wrong attempts add 5 seconds each; successful answers count toward mastery.':'Correct answers build mastery. Missed elements return for extra practice.'}</p></section><button class="btn ghost" id="endearly">End session</button>`;if(s.pendingNext){document.getElementById('nextq').onclick=()=>{if(s.kind==='speed'&&!s.feedback.correct){s.pendingNext=false;s.feedback=null;renderQuestion()}else advance()};document.getElementById('nextq').focus()}else{document.getElementById('answerform').onsubmit=e=>{if(s.kind==='speed'&&s.started===null)s.started=performance.now();submitAnswer(e)};document.getElementById('answerform').querySelector('input')?.focus()}document.getElementById('endearly').onclick=()=>{if(confirm('End this session early?')){if(s.kind==='speed'&&s.started!==null)s.finishTime=performance.now()-s.started;finishSession()}};if(s.kind==='speed'){const generation=++timerGeneration;updateTimer(generation)}}
function updateTimer(generation){if(generation!==timerGeneration||!session||session.kind!=='speed'||page!=='speed')return;let el=document.getElementById('timer');if(el)el.textContent=fmt(session.started===null?0:(session.finishTime??(performance.now()-session.started)));if(session.finishTime===null)requestAnimationFrame(()=>updateTimer(generation))}
function finishSession(){let s=session;if(s.kind==='speed'&&s.started!==null&&s.finishTime===null)s.finishTime=performance.now()-s.started;if(s.kind==='speed'&&s.idx>=s.items.length&&s.started!==null){let duration=s.finishTime+s.penalties;let id=[s.range,s.config.mode,s.config.prompt,s.config.order].join('|');if(data.bests[id]===undefined||duration<data.bests[id]){data.bests[id]=duration;save();s.newRecord=true}}page='finish';render()}
function renderFinish(){let s=session,full=s.idx>=s.items.length,accuracy=s.attempts?Math.round(s.correct/s.attempts*100):0;app.innerHTML=`<section class="card"><h2>${full?'Session complete!':'Session ended'}</h2><div class="sub"><div class="stats"><span>Correct responses: <strong>${s.correct}</strong></span><span>Attempts: <strong>${s.attempts}</strong></span><span>Accuracy: <strong>${accuracy}%</strong></span><span>Missed elements: <strong>${s.missed.size}</strong></span></div>${s.kind==='speed'?`<h3>Time: ${fmt(s.finishTime||0)}</h3><p>Penalties: ${fmt(s.penalties)} · Adjusted time: <strong class="focus">${fmt((s.finishTime||0)+s.penalties)}</strong></p>${s.newRecord?'<p class="focus"><strong>New personal best!</strong></p>':''}`:''}</div>${s.missed.size?`<p>Review: ${[...s.missed].map(n=>`${elements[n-1].symbol} (${elements[n-1].name})`).join(', ')}</p>`:'<p>Great work—no missed elements!</p>'}<div class="row"><button class="btn primary" id="again">Try again</button><button class="btn" id="back">Choose another group</button></div></section>`;document.getElementById('again').onclick=()=>go(s.kind);document.getElementById('back').onclick=updateHome}
function renderProgress(){app.innerHTML=`<section class="card"><h2>Element progress</h2><p class="muted small">An element counts as mastered after you correctly recall two different facts (name, symbol, or atomic number). This is a first milestone, not a guarantee of long-term retention. Continue reviewing all three facts. Previous version practice history is retained.</p><div class="tablewrap"><table><thead><tr><th>#</th><th>Element</th><th>Status</th><th>Correct answers recorded</th></tr></thead><tbody>${elements.map(e=>{let x=data.mastery[e.number],f=masteryFields(x),known=x?.byAnswer?['name','symbol','number'].filter(k=>x.byAnswer[k]>0).join(', '):x?.correct?'Earlier practice (credited)':'—';return `<tr><td>${e.number}</td><td>${esc(e.symbol)} — ${esc(e.name)}</td><td>${mastered(e)?'✓ Mastered':practiced(e)?'In progress':'Not started'}</td><td>${esc(known)}</td></tr>`}).join('')}</tbody></table></div></section>`}

function renderRecords(){let records=Object.entries(data.bests).sort((a,b)=>a[0].localeCompare(b[0]));app.innerHTML=`<section class="card"><h2>Speed Challenge personal bests</h2>${records.length?`<div class="tablewrap"><table><thead><tr><th>Element range</th><th>Answer mode</th><th>Prompt</th><th>Order</th><th>Best adjusted time</th></tr></thead><tbody>${records.map(([k,v])=>{let [r,m,p,o]=k.split('|');return `<tr><td>${esc(r)}</td><td>${esc(m)}</td><td>${esc(p)}</td><td>${esc(o)}</td><td>${fmt(v)}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">No speed challenge records yet.</p>'}</section>`}

function exportBackup(){
 const backup={format:'element-mastery-backup',version:1,exportedAt:new Date().toISOString(),data};
 const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download='element-mastery-progress-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importBackup(event){
 const file=event.target.files?.[0];event.target.value='';if(!file)return;
 try{
  if(file.size>2000000)throw new Error('Backup file is too large');
  const raw=JSON.parse(await file.text());
  if(raw?.format!=='element-mastery-backup'||raw.version!==1||!raw.data||typeof raw.data!=='object'||Array.isArray(raw.data)||typeof raw.data.mastery!=='object'||!raw.data.mastery||Array.isArray(raw.data.mastery)||typeof raw.data.bests!=='object'||!raw.data.bests||Array.isArray(raw.data.bests)||typeof raw.data.settings!=='object'||!raw.data.settings||Array.isArray(raw.data.settings))throw new Error('Not a valid Element Mastery backup');
  if(!confirm('Replace this device’s current progress and personal bests with the selected backup?'))return;
  data={...defaults(),...raw.data,settings:{...defaults().settings,...raw.data.settings}};save();render();toast('Progress backup imported');
 }catch(error){alert('Unable to import backup: '+error.message)}
}

window.go=go;render();
</script></body></html>
